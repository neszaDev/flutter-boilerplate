# The backend for local development and integration tests (`make backend-up` / `make e2e`):
# Postgres + the published Spring API image, the same setup as the web app's compose file.
#
# The app on an emulator or simulator reaches it at http://10.0.2.2:8080 (Android) or
# http://localhost:8080 (iOS); a phone on the same Wi-Fi at http://<your computer's IP>:8080.
name: flutter-boilerplate
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boilerplate -d boilerplate']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ['postgres-data:/var/lib/postgresql/data']

  backend:
    # Published by the backend repo's CI/CD. amd64-only: Apple Silicon runs it under
    # emulation (slower to start, otherwise identical).
    image: ghcr.io/neszadev/spring-postgres-boilerplate:${BACKEND_TAG:-dev}
    platform: linux/amd64
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/boilerplate
      DB_USERNAME: boilerplate
      DB_PASSWORD: boilerplate
      JWT_SECRET: ${BACKEND_JWT_SECRET:-local-development-secret-at-least-32-bytes}
      # A known admin for local use and the integration tests. Local only.
      ADMIN_EMAIL: ${BACKEND_ADMIN_EMAIL:-admin@e2e.test}
      ADMIN_PASSWORD: ${BACKEND_ADMIN_PASSWORD:-e2e-admin-password}
      # Integration tests register users from one address.
      RATE_LIMIT_REGISTER_PER_IP: ${BACKEND_RATE_LIMIT_PER_IP:-10000}
      RATE_LIMIT_LOGIN_PER_IP: ${BACKEND_RATE_LIMIT_PER_IP:-10000}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['${BACKEND_PORT:-8080}:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP']
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres-data: {}
