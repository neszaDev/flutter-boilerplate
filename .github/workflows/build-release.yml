# The only place release builds are defined; cd-dev.yml and cd-main.yml call it.
# Android is signed when the environment has the ANDROID_KEYSTORE_BASE64 secret (and its
# passwords, see docs/releasing.md); otherwise it is debug-signed, fine for testers only.
# iOS: an unsigned build proves it compiles; signing and TestFlight upload need an Apple
# certificate and profile, added per docs/releasing.md.
name: Build release

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev or main), for approvals and secrets
        required: true
        type: string
      app-env:
        description: Build configuration, env/<app-env>.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Android (${{ inputs.app-env }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Signing key from secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the build is debug-signed."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: App bundle and APK
        run: |
          make build-appbundle ENV=${{ inputs.app-env }}
          make build-apk ENV=${{ inputs.app-env }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.app-env }}-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
      # Needed to read obfuscated stack traces from this exact build.
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-android-${{ inputs.app-env }}-${{ github.sha }}
          path: build/symbols/${{ inputs.app-env }}
          retention-days: 90

  ios:
    name: iOS (${{ inputs.app-env }})
    runs-on: macos-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Release build without signing
        run: make build-ios ENV=${{ inputs.app-env }}
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-ios-${{ inputs.app-env }}-${{ github.sha }}
          path: build/symbols/${{ inputs.app-env }}
          retention-days: 90
