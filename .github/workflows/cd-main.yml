# Push to main or a v* tag: run CI, wait for approval on the main environment, then build the
# production release. A tag also gets a GitHub Release with the Android files attached.
name: CI/CD - main

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    uses: ./.github/workflows/build-release.yml
    with:
      environment: main
      app-env: prod
    secrets: inherit

  github-release:
    name: GitHub Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-prod-${{ github.sha }}
          path: dist
      - name: Create the release
        run: gh release create "$TAG" --repo "$REPO" --generate-notes dist/**/*.aab dist/**/*.apk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
