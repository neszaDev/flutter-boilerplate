# Weekly updates, opened against dev (they reach main with the next release). Minor/patch bumps
# are grouped per ecosystem; majors arrive as separate PRs and need a deliberate review (plugin
# majors often need native changes: read their changelog and run `make verify` and `make e2e`).
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: ci }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    target-branch: dev
    commit-message: { prefix: build, include: scope }
    groups:
      gradle:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: build, include: scope }
