name: flutter_boilerplate
description: "Flutter + Spring Boilerplate: a phone app for the spring-postgres-boilerplate API."
publish_to: 'none'

# build-name (versionName / CFBundleShortVersionString) + build-number (versionCode / CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App core: state, routing, backend client, session storage, settings, i18n, logging.
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http_parser: ^4.1.2
  intl: ^0.20.3
  logging: ^1.3.0
  mime: ^2.1.0
  shared_preferences: ^2.5.6

  # Phone features (see docs/device-features.md): biometrics, sensors, camera, QR, location,
  # notifications, sharing, device and network state.
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.5
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3

  # Showcase screens (lib/features/showcase): charts, maps, editors, icons, spinners, masks.
  fl_chart: ^1.2.0
  flutter_map: ^8.3.2
  flutter_quill: ^11.6.0
  flutter_spinkit: ^5.2.2
  font_awesome_flutter: ^11.0.0
  highlight: ^0.7.0
  latlong2: ^0.10.1
  lucide_icons_flutter: ^3.1.22
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # Localizations are generated from lib/l10n/arb (written by `make l10n` from l10n/<locale>/*.json).
  generate: true

  assets:
    - assets/images/

  # Bundled so text renders the same offline and on first launch (OFL licences in assets/fonts).
  fonts:
    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin-400.ttf
          weight: 400
        - asset: assets/fonts/LibreFranklin-500.ttf
          weight: 500
        - asset: assets/fonts/LibreFranklin-600.ttf
          weight: 600
        - asset: assets/fonts/LibreFranklin-700.ttf
          weight: 700
        - asset: assets/fonts/LibreFranklin-800.ttf
          weight: 800
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-400.ttf
          weight: 400
        - asset: assets/fonts/Kalam-700.ttf
          weight: 700
